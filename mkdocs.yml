site_name: CONTROL Resonant Mod Loader
site_url: https://crml.nnamllit.de/
repo_url: https://github.com/Nnamllit1/Control-Resonant-Mod-Loader
repo_name: Nnamllit1/Control-Resonant-Mod-Loader
edit_uri: edit/main/docs/
site_description: CONTROL Resonant modding framework with sandboxed WebAssembly mods, a native runtime, and public Northlight engine research for mod developers.
strict: true
theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
extra_css:
  - stylesheets/theme.css
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
nav:
  - Home: index.md
  - Using mods:
      - Installation: installation.md
      - Troubleshooting: troubleshooting.md
  - Build a mod:
      - Getting started: developing.md
      - Package format and API: api.md
      - Sandbox limits: sandbox.md
  - Contributing:
      - Architecture: architecture.md
      - Northlight engine research: engine-research.md
      - Engine atlas: engine-atlas.md
      - Engine diagnostics: engine-validation.md
      - System index: engine-system-index.md
      - Reviewed engine paths: engine-paths.md
      - Lua bytecode tools: binlua.md
      - Engine Lua integration: engine-lua.md
      - Engine internals: engine-internals.md
      - Physics dynamics: physics-dynamics.md
      - Entity inspector: entity-inspector.md
      - Player visibility: visibility.md
      - Pack2 format: pack2.md
      - Gameplay and noclip: gameplay.md
      - Guest-controlled movement: movement.md
      - Player fall recovery: fall-recovery.md
  - Physics property trial: physics-trial.md
  - Documentation: documentation.md
  - Brand assets: brand.md
  - Building releases: releases.md
