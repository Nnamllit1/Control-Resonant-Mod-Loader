site_name: CONTROL Resonant Mod Loader
site_url: https://crml.nnamllit.de/
repo_url: https://github.com/Nnamllit1/Control-Resonant-Mod-Loader
repo_name: Nnamllit1/Control-Resonant-Mod-Loader
edit_uri: edit/main/docs/
site_description: CONTROL Resonant modding framework with sandboxed WebAssembly mods, a native runtime, and public Northlight engine research for mod developers.
strict: true
theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
extra_css:
  - stylesheets/theme.css
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
nav:
  - Home: index.md
  - Play with mods:
      - Download and install: installation.md
      - Troubleshooting: troubleshooting.md
  - Make a mod:
      - Your first mod: developing.md
      - Package format and API: api.md
      - Sandbox limits: sandbox.md
  - Contributing:
      - Build from source: building.md
      - Architecture: architecture.md
      - Engine research:
          - Overview: engine-research.md
          - Subsystem atlas: engine-atlas.md
          - System index: engine-system-index.md
          - Reviewed operation paths: engine-paths.md
          - Entity and resource internals: engine-internals.md
          - Assets and Pack2: pack2.md
          - Lua bytecode tools: binlua.md
          - Engine Lua integration: engine-lua.md
          - Physics dynamics: physics-dynamics.md
      - Diagnostics and examples:
          - Engine diagnostics: engine-validation.md
          - Entity inspector: entity-inspector.md
          - Player visibility: visibility.md
          - Physics property trial: physics-trial.md
          - Wasm movement example: movement.md
          - Fall and boundary recovery: fall-recovery.md
          - Legacy noclip prototype: gameplay.md
      - Project maintenance:
          - Building releases: releases.md
          - Maintaining the website: documentation.md
          - Logos and brand assets: brand.md
