<!-- crml-native-ui-v1: self-authored extension for the engine-owned options page -->
<script>
(function () {
    'use strict';
    if (window.__crmlNativeUi) return;
    var stackName = 'menu_options';
    var normalStates = ['gameplay', 'controls', 'graphics', 'audio', 'interface'];
    var state = { enabled: false, amount: 50 };
    var mounted = [];
    var active = null;
    var timer = null;
    var scanning = false;
    var stopped = false;
    var stopping = false;
    var cancelFrame = null;
    var drag = null;
    var lastError = '';

    function element(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text) node.textContent = text;
        return node;
    }
    function consume(event) {
        if (event && typeof event.stopPropagation === 'function') event.stopPropagation();
        if (event && typeof event.preventDefault === 'function') event.preventDefault();
    }
    function nativeStack() {
        var api = window.stack;
        return api && typeof api.active === 'function' && typeof api.state === 'function' ? api : null;
    }
    function currentState() {
        try { var api = nativeStack(); return api ? api.state(stackName) : ''; }
        catch (_) { return ''; }
    }
    function connected(node) { return document.documentElement.contains(node); }
    function visible(entry) {
        return connected(entry.container) && entry.container.classList.contains('fullscreen-layout--visible');
    }
    function owns(entry) {
        if (active !== entry || entry.phase !== 'active' || currentState() !== entry.previousState) return false;
        try { return visible(entry) && nativeStack().active(stackName); }
        catch (_) { return false; }
    }
    function error(entry, message) {
        lastError = message;
        if (entry.status.textContent !== message) entry.status.textContent = message;
    }
    function refresh() { mounted.forEach(function (entry) { entry.render(); }); }
    function present(entry, show) {
        if (show) {
            if (!entry.container.hasAttribute('data-crml-mods-active')) entry.container.setAttribute('data-crml-mods-active', '1');
        } else entry.container.removeAttribute('data-crml-mods-active');
        var display = show ? 'block' : 'none';
        if (entry.root.style.display !== display) entry.root.style.display = display;
        var tabs = entry.tabbar.querySelectorAll('.menu-button');
        for (var i = 0; i < tabs.length; ++i) {
            if (tabs[i] === entry.tab) continue;
            if (show) tabs[i].setAttribute('data-crml-native-muted', '1');
            else tabs[i].removeAttribute('data-crml-native-muted');
        }
        ['menu-button--selected', 'selection-item--selected'].forEach(function (name) {
            if (entry.tab.classList.contains(name) !== show) entry.tab.classList.toggle(name, show);
        });
    }
    function endDrag() {
        if (drag) drag.entry.fill.classList.remove('options-slider__bar__fill--dragging');
        drag = null;
        window.removeEventListener('mousemove', moveDrag);
        window.removeEventListener('mouseup', releaseDrag);
        window.removeEventListener('blur', endDrag);
        window.removeEventListener('resize', endDrag);
    }
    // Keep the engine's existing Options state and native input ownership.
    // Replacing it with an unregistered state leaves no matching native input
    // context. Only suspend these exact stock control callbacks while our page
    // hides their controls; never clear an event or touch unrelated listeners.
    var stockEvents = [
        ['OnCancel', 'onCancel'], ['OnPrev', 'onPrevTab'], ['OnNext', 'onNextTab'],
        ['OnNavigateLeft', 'onNavigateLeft'], ['OnNavigateRight', 'onNavigateRight'],
        ['OnSelect', 'onSelectOption']
    ];
    function routeRoot() {
        var routes = window.routes;
        return routes && routes.menu_options && routes.menu_options.root;
    }
    function releaseControls(entry) {
        var controls = entry.controls;
        entry.controls = null;
        if (!controls) return;
        controls.engine.off('OnCancel', cancel);
        // The native active=false lifecycle removes its handlers itself. Adding
        // them after that point would leak listeners into gameplay and duplicate
        // them the next time Options opens. A replacement route owns itself too.
        if (nativeStack() && nativeStack().active(stackName) && routeRoot() === controls.root) {
            controls.removed.forEach(function (item) { controls.engine.on(item[0], item[1]); });
        }
    }
    function acquireControls(entry) {
        var engine = window.engine, root = routeRoot();
        if (!engine || typeof engine.on !== 'function' || typeof engine.off !== 'function' || !root) return false;
        if (!stockEvents.every(function (pair) { return typeof root[pair[1]] === 'function'; })) return false;
        var controls = { engine: engine, root: root, removed: [] };
        entry.controls = controls;
        try {
            stockEvents.forEach(function (pair) {
                engine.off(pair[0], root[pair[1]]);
                controls.removed.push([pair[0], root[pair[1]]]);
            });
            engine.on('OnCancel', cancel);
            return true;
        } catch (_) { releaseControls(entry); return false; }
    }
    function leave() {
        if (!active) return true;
        var entry = active;
        active = null;
        entry.phase = 'idle';
        endDrag();
        present(entry, false);
        entry.tab.classList.remove('menu-button--focused');
        releaseControls(entry);
        error(entry, '');
        return true;
    }
    function enter(entry) {
        if (stopping || active === entry) return;
        leave();
        var api = nativeStack();
        if (!api || !visible(entry)) { error(entry, 'Mods tab is unavailable in this UI session.'); return; }
        var previous = currentState();
        if (!api.active(stackName) || normalStates.indexOf(previous) < 0) {
            error(entry, 'Return to a main options tab first.'); return;
        }
        if (!acquireControls(entry)) { error(entry, 'Mods controls are unavailable in this UI session.'); return; }
        entry.previousState = previous;
        entry.phase = 'active';
        active = entry;
        present(entry, true);
        error(entry, '');
    }
    function cancel() {
        if (!active || !owns(active) || cancelFrame !== null) return;
        var entry = active;
        // Restore stock handlers after this entire native event dispatch ends.
        // The same Cancel must not also close the underlying Options menu.
        cancelFrame = window.requestAnimationFrame(function () {
            cancelFrame = null;
            if (active === entry) leave();
        });
    }
    function xPosition(event) {
        // The game's native slider uses screenX as a view-space coordinate.
        // Browser previews use clientX, where screenX includes the OS window offset.
        if (window.engine && window.engine.isAttached === true && event &&
            typeof event.screenX === 'number' && isFinite(event.screenX)) return event.screenX;
        if (event && typeof event.clientX === 'number' && isFinite(event.clientX)) return event.clientX;
        if (event && typeof event.screenX === 'number' && isFinite(event.screenX)) return event.screenX;
        return null;
    }
    function sliderGeometry(entry) {
        var box = entry.bar.getBoundingClientRect();
        var left = typeof box.x === 'number' ? box.x : box.left;
        return typeof left === 'number' && isFinite(left) && typeof box.width === 'number' &&
            isFinite(box.width) && box.width > 0 ? { left: left, width: box.width } : null;
    }
    function updateSlider(entry, event, geometry) {
        if (!owns(entry)) return;
        var box = geometry || sliderGeometry(entry);
        var x = xPosition(event);
        if (!box || x === null) return;
        state.amount = Math.max(0, Math.min(100, Math.round((x - box.left) * 100 / box.width)));
        refresh();
    }
    function moveDrag(event) {
        if (!drag || !owns(drag.entry)) { endDrag(); return; }
        consume(event);
        updateSlider(drag.entry, event, drag.geometry);
    }
    function releaseDrag(event) {
        if (drag) updateSlider(drag.entry, event, drag.geometry);
        endDrag();
    }
    function interactive(node) {
        node.style.pointerEvents = 'auto';
        node.style.cursor = 'pointer';
        var children = node.querySelectorAll('*');
        for (var i = 0; i < children.length; ++i) children[i].style.pointerEvents = 'none';
    }
    function hover(node, className) {
        node.addEventListener('mouseenter', function () { node.classList.add(className); });
        node.addEventListener('mouseleave', function () { node.classList.remove(className); });
    }
    function remove(node) { if (node.parentNode) node.parentNode.removeChild(node); }

    function mount(container, tabbar, content) {
        var tab = element('div', 'menu-button tab-buttons-button tab-buttons__element');
        tab.setAttribute('data-crml-native-tab', '1');
        tab.appendChild(element('div', 'menu-button__label', 'Mods'));
        interactive(tab);
        hover(tab, 'menu-button--focused');
        var status = element('div', '', '');
        status.setAttribute('data-crml-native-status', '1');
        status.style.cssText = 'position:absolute;bottom:0;left:1.85vh;font-size:1.5vh;pointer-events:none';
        var root = element('div', 'crml-native-ui');
        root.setAttribute('data-crml-native-ui', '1');
        root.style.cssText = 'display:none;padding:1vh 0;width:70vh;max-width:100%;position:relative';
        var heading = element('div', '', 'CRML controls');
        heading.style.cssText = 'font-size:2.3vh;font-weight:700;padding:1vh 1.85vh';
        root.appendChild(heading);
        var toggle = element('div', 'options-checkbox');
        toggle.setAttribute('data-crml-native-toggle', '1');
        toggle.appendChild(element('div', 'options-checkbox__label', 'Example toggle'));
        var toggleValue = element('div', '', 'OFF');
        toggleValue.style.cssText = 'margin-left:auto;font-size:2.2vh';
        toggle.appendChild(toggleValue);
        root.appendChild(toggle);
        interactive(toggle);
        hover(toggle, 'options-checkbox--focused');
        var slider = element('div', 'options-slider');
        slider.style.cssText = 'width:100%;box-sizing:border-box';
        slider.appendChild(element('div', 'options-slider__label', 'Example amount'));
        var bar = element('div', 'options-slider__bar');
        bar.style.cssText = 'width:23.15vh;min-width:23.15vh;flex:0 0 23.15vh';
        bar.setAttribute('data-crml-native-slider', '1');
        var fill = element('div', 'options-slider__bar__fill');
        fill.style.width = '100%';
        bar.appendChild(fill);
        slider.appendChild(bar);
        var value = element('div', 'options-slider__value');
        value.style.cssText = 'margin-left:1vh;width:4.5vh;min-width:4.5vh;flex:0 0 4.5vh;text-align:right';
        slider.appendChild(value);
        root.appendChild(slider);
        interactive(bar);
        hover(slider, 'options-slider--focused');
        slider.addEventListener('mouseenter', function () {
            bar.classList.add('options-slider__bar--focused');
            fill.classList.add('options-slider__bar__fill--focused');
            value.classList.add('options-slider__value--focused');
        });
        slider.addEventListener('mouseleave', function () {
            bar.classList.remove('options-slider__bar--focused');
            fill.classList.remove('options-slider__bar__fill--focused');
            value.classList.remove('options-slider__value--focused');
        });
        function button(label, attribute) {
            var node = element('div', 'options-button');
            node.setAttribute(attribute, '1');
            var text = element('div', 'options-button__label', label);
            text.style.cssText = 'flex:0 0 auto;white-space:nowrap';
            node.appendChild(text);
            interactive(node);
            hover(node, 'options-button--focused');
            root.appendChild(node);
            return node;
        }
        var reset = button('Restore example defaults', 'data-crml-native-reset');
        var back = button('Back to game options', 'data-crml-native-back');
        var note = element('div', '', 'Interface example. No gameplay changes. Use the mouse to adjust controls.');
        note.style.cssText = 'font-size:1.5vh;opacity:0.7;padding:1vh 1.85vh';
        root.appendChild(note);
        var entry = { container: container, tabbar: tabbar, content: content,
            root: root, tab: tab, bar: bar, fill: fill, status: status, previousState: '', controls: null,
            phase: 'idle', render: function () {
                toggleValue.textContent = state.enabled ? 'ON' : 'OFF';
                value.textContent = String(state.amount);
                // Keep the native slider's nonzero minimum scale so its matrix
                // remains invertible at zero without changing the readout.
                fill.style.transform = 'matrix(' + Math.max(0.001, state.amount / 100) + ',0,0,1,0,0)';
            } };
        tab.addEventListener('click', function (event) { consume(event); enter(entry); });
        toggle.addEventListener('click', function (event) {
            consume(event);
            if (!owns(entry)) return;
            state.enabled = !state.enabled;
            refresh();
        });
        // Native sliders update on mousedown/move. Consuming the later click
        // avoids recalculating once more after mouseup has ended the drag.
        bar.addEventListener('click', consume);
        bar.addEventListener('mousedown', function (event) {
            consume(event);
            if (!owns(entry) || (typeof event.button === 'number' && event.button !== 0)) return;
            endDrag();
            var geometry = sliderGeometry(entry);
            if (!geometry) return;
            // Capture the track once, like the game does, so readout/layout
            // updates cannot move the coordinate origin under the pointer.
            drag = { entry: entry, geometry: geometry };
            fill.classList.add('options-slider__bar__fill--dragging');
            updateSlider(entry, event, geometry);
            window.addEventListener('mousemove', moveDrag);
            window.addEventListener('mouseup', releaseDrag);
            window.addEventListener('blur', endDrag);
            window.addEventListener('resize', endDrag);
        });
        reset.addEventListener('click', function (event) {
            consume(event);
            if (!owns(entry)) return;
            state.enabled = false;
            state.amount = 50;
            refresh();
        });
        back.addEventListener('click', function (event) { consume(event); if (active === entry) leave(); });
        entry.baseTab = function (event) {
            if (active !== entry) return;
            var target = event.target;
            while (target && target !== tabbar) {
                var expression = target.getAttribute && target.getAttribute('data-bind-click');
                var match = expression && /^routes\.menu_options\.root\.onTab\((0|3|5|6|7)\)$/.exec(expression);
                if (match) {
                    consume(event);
                    if (event.type === 'mousedown') return;
                    leave();
                    var root = routeRoot();
                    if (root && typeof root.onTab === 'function') root.onTab(Number(match[1]));
                    return;
                }
                target = target.parentNode;
            }
        };
        // Consume both mouse phases, but route only the click. Restoring on
        // mousedown would let the later native click select the tab twice.
        tabbar.addEventListener('mousedown', entry.baseTab, true);
        tabbar.addEventListener('click', entry.baseTab, true);
        mounted.push(entry);
        entry.render();
        tabbar.insertBefore(tab, tabbar.querySelector('.tab-buttons__key--right'));
        content.appendChild(root);
        content.appendChild(status);
    }
    function dispose(entry) {
        if (active === entry && !leave()) return false;
        entry.tabbar.removeEventListener('mousedown', entry.baseTab, true);
        entry.tabbar.removeEventListener('click', entry.baseTab, true);
        remove(entry.root);
        remove(entry.tab);
        remove(entry.status);
        entry.container.removeAttribute('data-crml-mods-active');
        return true;
    }
    function reconcile() {
        if (stopped) return;
        if (active && (!owns(active) || !connected(active.root) || !connected(active.tab) ||
            routeRoot() !== active.controls.root)) leave();
        if (stopping && !active) { completeStop(); return; }
        mounted = mounted.filter(function (entry) {
            if (connected(entry.container) && connected(entry.root) && connected(entry.tab) &&
                entry.root.parentNode === entry.content && entry.tab.parentNode === entry.tabbar) return true;
            return !dispose(entry);
        });
        // Native visible-if caches clone nodes, dropping event listeners. A copied
        // marker is not ownership: remove those orphan copies and bind fresh nodes.
        var copies = document.querySelectorAll('[data-crml-native-ui], [data-crml-native-tab], [data-crml-native-status]');
        for (var c = 0; c < copies.length; ++c) {
            var node = copies[c];
            var owned = mounted.some(function (entry) { return node === entry.root || node === entry.tab || node === entry.status; });
            if (!owned) remove(node);
        }
        var containers = document.querySelectorAll('.options');
        for (var i = 0; i < containers.length && mounted.length < 4; ++i) {
            var container = containers[i];
            if (mounted.some(function (entry) { return entry.container === container; })) continue;
            container.removeAttribute('data-crml-mods-active');
            var muted = container.querySelectorAll('[data-crml-native-muted]');
            for (var j = 0; j < muted.length; ++j) muted[j].removeAttribute('data-crml-native-muted');
            var tabbar = container.querySelector('.tab-buttons');
            var content = container.querySelector('.options__content');
            if (tabbar && content && content.querySelector('.tabs__pages')) mount(container, tabbar, content);
        }
    }
    function scan() {
        if (stopped || scanning) return;
        scanning = true;
        try { reconcile(); }
        finally { scanning = false; }
    }
    var styles = element('style', '');
    styles.textContent = '[data-crml-mods-active] .options__content > .tabs__pages{display:none !important;pointer-events:none !important}' +
        '[data-crml-native-muted]{--foreground-color:#e8e8e8 !important;--background-color:transparent !important;--icon-color:#e8e8e8 !important;color:#e8e8e8 !important;background-color:transparent !important;pointer-events:auto !important}' +
        '[data-crml-native-ui] .options-slider__label{min-width:0}' +
        '[data-crml-native-ui] .options-slider__bar__fill--dragging{transition:none}';
    function start() {
        if (stopped || timer !== null) return;
        document.head.appendChild(styles);
        scan();
        // Reconcile at a bounded rate. DOM mutation delivery/filter behavior in
        // the embedded renderer must not recursively trigger our own mutations.
        timer = window.setInterval(scan, 200);
    }
    function completeStop() {
        stopped = true;
        if (timer !== null) window.clearInterval(timer);
        if (cancelFrame !== null) window.cancelAnimationFrame(cancelFrame);
        endDrag();
        document.removeEventListener('DOMContentLoaded', start);
        window.removeEventListener('unload', stop);
        mounted.forEach(dispose);
        mounted = [];
        remove(styles);
        delete window.__crmlNativeUi;
    }
    function stop() {
        if (stopped) return true;
        stopping = true;
        if (active && !leave()) return false;
        completeStop();
        return true;
    }
    window.__crmlNativeUi = { stop: stop, status: function () {
        return { active: !!active && owns(active), pending: !!active && !owns(active),
            phase: active ? active.phase : 'idle', enabled: state.enabled, amount: state.amount, error: lastError };
    } };
    window.addEventListener('unload', stop);
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
}());
</script>
